name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Repository check and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check required documents
        run: |
          set -euo pipefail
          for f in PROGRESS.md README.md .gitignore; do
            if [ ! -f "$f" ]; then
              echo "::error::required file missing: $f"
              exit 1
            fi
            echo "ok: $f"
          done
          if [ ! -f AGENTS.md ]; then
            echo "::warning::AGENTS.md not found in repository (CI rules taken from project brief)"
          fi

      - name: Detect Gradle wrapper
        id: gradle
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Gradle wrapper found: build steps will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Gradle wrapper not committed yet: build steps are skipped (Step 2)."
          fi

      - name: Set up JDK 17
        if: steps.gradle.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        if: steps.gradle.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle
        if: steps.gradle.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: steps.gradle.outputs.ready == 'true'
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        if: steps.gradle.outputs.ready == 'true'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        if: steps.gradle.outputs.ready == 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: steps.gradle.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

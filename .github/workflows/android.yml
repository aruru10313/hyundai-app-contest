name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-check:
    name: Repository skeleton check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check required documents
        run: |
          set -euo pipefail
          for f in PROGRESS.md README.md .gitignore; do
            if [ ! -f "$f" ]; then
              echo "::error::required file missing: $f"
              exit 1
            fi
            echo "ok: $f"
          done
          if [ ! -f AGENTS.md ]; then
            echo "::warning::AGENTS.md not found in repository (CI rules taken from project brief)"
          fi

      - name: Report Gradle readiness
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Gradle wrapper found: build job will run."
          else
            echo "Gradle wrapper not committed yet: build job will be skipped (Step 2)."
          fi

  android-build:
    name: Build debug APK
    needs: repo-check
    # Activated automatically once the Gradle wrapper is committed (Step 2).
    if: ${{ hashFiles('gradlew', 'gradle/wrapper/gradle-wrapper.properties') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
